name: SOXL Daily Update

on:
  schedule:
    # 毎日 日本時間の朝6:30（米国引け後）に実行
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    # User-approved temporary pause (2026-10-26). Remove only after resume approval.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v3からv4へ最新化

      - name: Setup Python
        uses: actions/setup-python@v5 # v4からv5へ最新化
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests gspread oauth2client

      - name: Run script
        id: run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          # Sheetsは現行どおり有効。無効にする場合も明示的に false とする。
          SHEETS_ENABLED: 'true'
          # 対象セッション日（YYYY-MM-DD）。決定方式は未決のため、未設定なら
          # main.py が設定エラーで非0終了する（データ最終行から推測しない）。
          TARGET_SESSION_DATE: ${{ vars.TARGET_SESSION_DATE }}
        run: python main.py

      # アプリ本体が実行されなかった（先行ステップの失敗）場合のみ、
      # 追加依存なしの curl で失敗を1回だけ報告する。本体が失敗した場合は
      # 本体が通知を試みるため二重送信しない。報告の成否に関わらずジョブは
      # 先行の失敗のまま（成功へ変えない）。checkout 自体の失敗や共通の
      # 通知経路の故障は保証できない。
      - name: Report setup failure
        if: ${{ failure() && steps.run.outcome == 'skipped' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "失敗報告: 通知設定がないため送れません。"
            exit 1
          fi
          # curlの標準エラーは設定値（URL）を含み得るため捨て、非秘密の分類だけを出す。
          # 1回だけ送信し、リダイレクトは追従しない（-L なし）。
          rc=0
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H 'Content-Type: application/json' \
            -d '{"content":"🚫 **【SOXL 運用エラー】** 実行準備（依存導入など）に失敗したため、データ検査・売買判定・Sheets記録は実行していません（条件未達ではありません）。F&G: 目視未確認"}' \
            "$DISCORD_WEBHOOK_URL" 2>/dev/null) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "失敗報告: 配信不明（curl終了値 ${rc}）。自動再送はしません。"
            exit 1
          fi
          case "$code" in
            2??) echo "失敗報告: 送信成功（HTTP ${code}）" ;;
            *) echo "失敗報告: HTTP失敗（HTTP ${code}）。自動再送はしません。"; exit 1 ;;
          esac
